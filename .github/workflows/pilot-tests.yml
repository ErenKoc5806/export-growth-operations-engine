name: Pilot acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m compileall -q pilot_engine tests
      - run: python -m pilot_engine > /dev/null
      - run: python tools/check_style.py
