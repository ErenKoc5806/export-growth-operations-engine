name: Pilot acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and reject finalizer resource warnings
        shell: bash
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee /tmp/pilot-tests.log
          if grep -q 'ResourceWarning:' /tmp/pilot-tests.log; then
            echo 'ResourceWarning appeared in test output'
            exit 1
          fi
      - run: python -m compileall -q pilot_engine tests
      - run: python -m pilot_engine > /dev/null
      - run: python tools/check_style.py
  windows-synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows synthetic operator startup
        run: python -m unittest discover -s tests -p test_windows_synthetic.py -v
      - name: Native Windows token and ACL security checks
        run: python -W error::ResourceWarning -m unittest discover -s tests -p test_windows_security.py -v
      - name: Native Windows handle-checked files and secrets
        run: python -W error::ResourceWarning -m unittest discover -s tests -p test_windows_files.py -v
